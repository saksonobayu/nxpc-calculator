<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Nexpace Converter</title>
    <link rel="icon" href="pinkbean.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-image: linear-gradient(to top, #fbc2eb 0%, #a6c1ee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #4a4a4a;
        }

        .calculator-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(166, 193, 238, 0.5);
            text-align: center;
            width: 90%;
            max-width: 350px;
            border: 4px solid white;
            transition: transform 0.3s ease;
        }

        .calculator-container:hover {
            transform: translateY(-5px);
        }

        .logo-container {
            margin-bottom: 10px;
        }
        
        .nxpc-logo {
            width: 80px;
            height: 80px;
            background-color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            filter: drop-shadow(0 4px 6px rgba(131, 56, 236, 0.3));
            animation: float 3s ease-in-out infinite;
            object-fit: contain;
            margin: 0 auto;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            color: #8338ec;
            margin-bottom: 5px;
            font-size: 1.8em;
            font-weight: 700;
        }

        .subtitle {
            color: #9b72cf;
            font-size: 0.9em;
            margin-bottom: 15px;
            display: block;
        }

        .price-update-badge {
            background: #48cae4;
            color: white;
            font-size: 0.65em;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: 600;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        label {
            display: block;
            color: #6a0dad;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
            margin-left: 5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px 60px 15px 15px;
            border: 2px solid #e0b0ff;
            border-radius: 20px;
            font-size: 1.2em;
            font-family: 'Quicksand', sans-serif;
            color: #555;
            outline: none;
            transition: all 0.3s;
            background: #faf5ff;
        }

        input[type="number"]:focus {
            border-color: #8338ec;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(131, 56, 236, 0.1);
        }

        .currency-tag {
            position: absolute;
            right: 15px;
            color: #8338ec;
            font-weight: 700;
            pointer-events: none;
        }

        .price-loader {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #e0b0ff;
            border-top: 2px solid #8338ec;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        button#convertButton {
            background: linear-gradient(45deg, #ff006e, #ff5c8d);
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 0, 110, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        button#convertButton:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(255, 0, 110, 0.5);
        }

        button#convertButton:active {
            transform: scale(0.95);
        }

        .result-box {
            background-color: #e0f7fa;
            padding: 20px;
            border-radius: 25px;
            border: 2px dashed #48cae4;
            position: relative;
            margin-bottom: 15px;
        }

        .result-box.neso-style {
            background-color: #ffe5ec;
            border-color: #ffcad4;
        }

        .result-label {
            font-size: 0.85em;
            color: #0096c7;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }
        
        .neso-style .result-label {
            color: #d63384;
        }

        .result-value {
            font-size: 2.2em;
            color: #0077b6;
            font-weight: 800;
            margin: 5px 0;
            word-break: break-all;
            line-height: 1.1;
        }

        .neso-style .result-value {
            color: #c9184a;
        }

        .token-name {
            color: #0077b6;
            font-weight: 600;
            font-size: 0.9em;
        }

        .neso-style .token-name {
            color: #a4133c;
        }

        .error-msg {
            color: #ff006e;
            font-size: 0.8em;
            margin-top: 5px;
            margin-left: 5px;
            display: none;
        }

        .live-price-status {
            font-size: 0.75em;
            color: #666;
            margin-top: 5px;
        }

        .manual-input-hint {
            font-size: 0.7em;
            color: #999;
            margin-top: 5px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        
        <div class="logo-container">
            <img class="nxpc-logo" src="nxpc_logo.png" alt="✨" onerror="this.style.display='none'">
        </div>

        <h1>NXPC Converter</h1>
        <span class="subtitle">Nexpace Token Calculator</span>
        
        <div class="price-update-badge" id="priceStatus">🔄 Fetching price...</div>

        <div class="input-group">
            <label for="nxpcPrice">Price of 1 NXPC <span id="priceTimestamp" style="font-weight:400;font-size:0.7em;color:#999;"></span></label>
            <div class="input-wrapper">
                <input type="number" id="nxpcPrice" value="0.48" min="0.0001" step="0.0001">
                <span class="currency-tag">USD</span>
                <span id="priceLoader" class="price-loader" style="display:none;"></span>
            </div>
            <div class="manual-input-hint">💡 You can also manually edit the price</div>
        </div>

        <div class="input-group">
            <label for="usdAmount">Amount to Convert</label>
            <div class="input-wrapper">
                <input type="number" id="usdAmount" placeholder="0.00" min="0" step="any">
                <span class="currency-tag">USD</span>
            </div>
            <div id="errorMsg" class="error-msg">Please enter a valid amount!</div>
        </div>
        
        <button id="convertButton">✨ Convert ✨</button>

        <div class="result-box">
            <p class="result-label">You Will Receive</p>
            <div id="nxpcResult" class="result-value">0.00</div>
            <span class="token-name">NXPC Tokens</span>
        </div>

        <div class="result-box neso-style">
            <p class="result-label">Equivalent Neso</p>
            <div id="nesoResult" class="result-value">0</div>
            <span class="token-name">Neso</span>
        </div>

        <div class="live-price-status" id="livePriceStatus">⏱️ Price updates every 30 seconds</div>
    </div>

    <script>
        // --- Pure HTML/JavaScript Solution ---
        // Using Binance API (FREE, No API Key Required)
        
        const priceInput = document.getElementById('nxpcPrice');
        const priceStatus = document.getElementById('priceStatus');
        const priceTimestamp = document.getElementById('priceTimestamp');
        const priceLoader = document.getElementById('priceLoader');
        const usdInput = document.getElementById('usdAmount');
        const resultDisplay = document.getElementById('nxpcResult');
        const nesoDisplay = document.getElementById('nesoResult');
        const errorMsg = document.getElementById('errorMsg');
        const convertBtn = document.getElementById('convertButton');

        let currentPrice = null;
        let updateInterval = null;

        // --- Helper Functions ---

        function formatNesoWithSuffix(num) {
            if (num === 0) return "0";
            if (num >= 1000000000) {
                return parseFloat((num / 1000000000).toFixed(2)) + 'b';
            }
            if (num >= 1000000) {
                return parseFloat((num / 1000000).toFixed(2)) + 'm';
            }
            if (num >= 1000) {
                return parseFloat((num / 1000).toFixed(2)) + 'k';
            }
            return num.toLocaleString();
        }

        function performConversion() {
            const usdAmount = parseFloat(usdInput.value);
            const tokenPrice = parseFloat(priceInput.value);

            if (isNaN(usdAmount) || usdAmount < 0) {
                if(usdInput.value !== "") {
                    errorMsg.style.display = 'block';
                    resultDisplay.innerText = "---";
                    nesoDisplay.innerText = "---";
                } else {
                    resultDisplay.innerText = "0.00";
                    nesoDisplay.innerText = "0";
                    errorMsg.style.display = 'none';
                }
                return;
            }

            if (isNaN(tokenPrice) || tokenPrice <= 0) {
                resultDisplay.innerText = "Error";
                return;
            }

            errorMsg.style.display = 'none';
            const tokenAmount = usdAmount / tokenPrice;
            const nesoAmount = tokenAmount * 100000;
            const formattedResult = parseFloat(tokenAmount.toFixed(4));
            const formattedNeso = formatNesoWithSuffix(nesoAmount);

            resultDisplay.innerText = formattedResult;
            nesoDisplay.innerText = formattedNeso;
        }

        // --- Fetch Price from Binance (FREE, No API Key) ---

        async function fetchPriceFromBinance() {
            priceLoader.style.display = 'inline-block';
            priceStatus.textContent = '🔄 Fetching price...';
            priceStatus.style.background = '#f0c040';

            try {
                // Using Binance public API for NXPC/USDT pair
                // Note: Replace 'NXPCUSDT' with the correct trading pair if different
                const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=NXPCUSDT');
                
                if (!response.ok) {
                    throw new Error('Price not available on Binance');
                }
                
                const data = await response.json();
                const price = parseFloat(data.price);
                
                if (price && price > 0) {
                    currentPrice = price;
                    priceInput.value = price.toFixed(8);
                    
                    const now = new Date();
                    priceTimestamp.textContent = `• Updated ${now.toLocaleTimeString()}`;
                    priceStatus.textContent = '✅ Live Price • Binance';
                    priceStatus.style.background = '#48cae4';
                    
                    if (usdInput.value && parseFloat(usdInput.value) > 0) {
                        performConversion();
                    }
                } else {
                    throw new Error('Invalid price data');
                }
            } catch (error) {
                console.log('Binance fetch failed, trying alternative source...');
                
                // Fallback to manual price if Binance doesn't have NXPC
                priceStatus.textContent = '⚠️ Using default price (manual)';
                priceStatus.style.background = '#ffb347';
                priceInput.value = '0.48'; // Default fallback price
                
                // Store the fallback price
                currentPrice = 0.48;
                const now = new Date();
                priceTimestamp.textContent = `• Manual ${now.toLocaleTimeString()}`;
            } finally {
                priceLoader.style.display = 'none';
            }
        }

        // --- Alternative: Fetch from CoinGecko (FREE, No API Key) ---

        async function fetchPriceFromCoinGecko() {
            priceLoader.style.display = 'inline-block';
            priceStatus.textContent = '🔄 Fetching from CoinGecko...';
            priceStatus.style.background = '#f0c040';

            try {
                // CoinGecko public API - Replace 'nexpace' with correct coin ID
                const response = await fetch(
                    'https://api.coingecko.com/api/v3/simple/price?ids=nexpace&vs_currencies=usd'
                );
                
                if (!response.ok) {
                    throw new Error('CoinGecko API error');
                }
                
                const data = await response.json();
                const price = data.nexpace?.usd;
                
                if (price && price > 0) {
                    currentPrice = price;
                    priceInput.value = price.toFixed(8);
                    
                    const now = new Date();
                    priceTimestamp.textContent = `• Updated ${now.toLocaleTimeString()}`;
                    priceStatus.textContent = '✅ Live Price • CoinGecko';
                    priceStatus.style.background = '#48cae4';
                    
                    if (usdInput.value && parseFloat(usdInput.value) > 0) {
                        performConversion();
                    }
                } else {
                    throw new Error('Invalid price data');
                }
            } catch (error) {
                console.log('CoinGecko fetch failed:', error);
                // Fallback to Binance or manual
                await fetchPriceFromBinance();
            } finally {
                priceLoader.style.display = 'none';
            }
        }

        // --- Start Live Updates ---

        function startLiveUpdates() {
            // Try CoinGecko first, fallback to Binance
            fetchPriceFromCoinGecko();
            
            // Then fetch every 30 seconds
            updateInterval = setInterval(fetchPriceFromCoinGecko, 30000);
        }

        // --- Event Listeners ---

        convertBtn.addEventListener('click', performConversion);
        usdInput.addEventListener('input', performConversion);
        priceInput.addEventListener('input', performConversion);

        // --- Initialize ---

        // Start fetching price
        startLiveUpdates();

        // Clean up interval when page is closed
        window.addEventListener('beforeunload', function() {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });

        console.log('🚀 NXPC Live Price Tracker initialized!');
        console.log('📡 Using CoinGecko API (no API key required)');
        console.log('💡 Note: If NXPC is not found, using manual price');
    </script>
</body>
</html>
